x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  volumes:
    - ./data:/app/data
    - ./checkpoints:/app/checkpoints
    - ./logs:/app/logs

services:
  checks:
    <<: *app
    command: ["sh", "-c", "ruff check . && black --check . && isort --check-only . && pytest"]

  train:
    <<: *app
    command: ["python", "-m", "src.train"]

  app:
    <<: *app
    command:
      [
        "streamlit",
        "run",
        "app/main.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]
    ports:
      - "8501:8501"

  optuna:
    <<: *app
    command:
      [
        "sh",
        "-c",
        "python -c \"import optuna; optuna.create_study(storage='sqlite:////app/logs/optuna.db', study_name='ru-review-sentiment', load_if_exists=True)\" && optuna-dashboard sqlite:////app/logs/optuna.db --host 0.0.0.0 --port 8080",
      ]
    ports:
      - "8081:8080"

  label-studio:
    image: heartexlabs/label-studio:1.16.0
    ports:
      - "8080:8080"
    environment:
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
    volumes:
      - label-studio:/label-studio/data
      - ./data/raw:/label-studio/files

volumes:
  label-studio:
