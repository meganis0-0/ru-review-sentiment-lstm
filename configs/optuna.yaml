n_trials: 20
n_trials_min: 20
n_trials_max: 50
storage: sqlite:///optuna.db
study_name: ru-review-sentiment-lstm
direction: maximize
metric: f1_macro
epochs: 8
seed: 42
pruner:
  name: median
  n_startup_trials: 5
  n_warmup_steps: 1
search_space:
  learning_rate:
    low: 0.0001
    high: 0.003
    log: true
  dropout:
    low: 0.1
    high: 0.5
  hidden_size:
    choices: [64, 128, 256]
  batch_size:
    choices: [16, 32, 64]
# Эмбеддинг остаётся Navec 300 из configs/model.yaml.
# Оптимизатор, weight decay, число слоёв и аугментация — следующий шаг поиска.
